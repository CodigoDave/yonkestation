name: Actualizar Ultimo Video YouTube

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-video:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        env:
          YOUTUBE_CHANNEL_ID: 'UCvH2-ALYopdaoSHx11fVScw'
        run: |
          python -c '
          import urllib.request
          import xml.etree.ElementTree as ET
          import os
          import re

          channel_id = os.environ["YOUTUBE_CHANNEL_ID"]
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          
          try:
              req = urllib.request.urlopen(url)
              xml_data = req.read()
              root = ET.fromstring(xml_data)
              
              ns = {"yt": "http://www.youtube.com/xml/schemas/2015", "atom": "http://www.w3.org/2005/Atom"}
              
              # Buscar todas las entradas y tomar la primera (la más reciente del feed)
              entries = root.findall("atom:entry", ns)
              if entries:
                  # Ordenar o asegurar que tomamos la primera de la lista
                  latest_entry = entries[0]
                  video_id = latest_entry.find("yt:videoId", ns).text
                  print(f"¡Último video exacto detectado!: {video_id}")
                  
                  with open("index.html", "r", encoding="utf-8") as f:
                      html_content = f.read()
                  
                  # Reemplazar el embed de YouTube en el index.html
                  new_html = re.sub(
                      r"https://www.youtube-nocookie\.com/embed/[a-zA-Z0-9_-]+",
                      f"https://www.youtube-nocookie.com/embed/{video_id}",
                      html_content
                  )
                  
                  with open("index.html", "w", encoding="utf-8") as f:
                      f.write(new_html)
                  print("index.html actualizado con el video más reciente.")
              else:
                  print("No se encontraron videos en el feed.")
          except Exception as e:
              print(f"Error al actualizar: {e}")
          '

      - name: Guardar y subir cambios al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática al video más reciente [skip ci]"
          branch: main